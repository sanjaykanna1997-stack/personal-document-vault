name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Runner Files
        run: flutter create --platforms=android --org=com.sanj.vault .

      - name: Configure Android SDK and FlutterFragmentActivity
        run: |
          python3 -c "
          import os, re

          # 1. Update android/local.properties
          local_props = 'android/local.properties'
          lines = []
          if os.path.exists(local_props):
              lines = open(local_props).read().splitlines()
          lines = [l for l in lines if not l.startswith('flutter.minSdkVersion')]
          lines.append('flutter.minSdkVersion=23')
          open(local_props, 'w').write('\n'.join(lines) + '\n')
          print('Configured flutter.minSdkVersion=23 in local.properties')

          # 2. Patch all Gradle scripts (Groovy build.gradle and Kotlin DSL build.gradle.kts)
          for root, dirs, files in os.walk('android'):
              for f in files:
                  if f.startswith('build.gradle'):
                      p = os.path.join(root, f)
                      c = open(p).read()
                      orig = c
                      c = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdkVersion 23', c)
                      c = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', c)
                      if c != orig:
                          open(p, 'w').write(c)
                          print('Patched minSdk in', p)

          # 3. Patch MainActivity to FlutterFragmentActivity
          for root, dirs, files in os.walk('android/app/src/main'):
              for f in files:
                  if f.startswith('MainActivity'):
                      p = os.path.join(root, f)
                      c = open(p).read()
                      if 'FlutterFragmentActivity' not in c:
                          c = c.replace('FlutterActivity', 'FlutterFragmentActivity')
                          open(p, 'w').write(c)
                          print('Patched', p, 'to FlutterFragmentActivity')

          # 4. Add USE_BIOMETRIC permission in AndroidManifest.xml
          for root, dirs, files in os.walk('android/app/src/main'):
              for f in files:
                  if f == 'AndroidManifest.xml':
                      p = os.path.join(root, f)
                      c = open(p).read()
                      if 'USE_BIOMETRIC' not in c:
                          c = c.replace('<application', '<uses-permission android:name=\"android.permission.USE_BIOMETRIC\"/>\n    <application')
                          open(p, 'w').write(c)
                          print('Added USE_BIOMETRIC permission in', p)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          echo "Building APK..."
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Document-Vault-apk
          path: build/app/outputs/flutter-apk/*.apk
