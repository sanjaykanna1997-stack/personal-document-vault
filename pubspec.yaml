name: sanj_ai
description: SANJ AI - Your life, your goals, your AI.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  open_filex: ^4.6.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sanj_ai_logo.png
